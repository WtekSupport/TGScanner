[package]
name = "tgscanner"
version = "1.0.1"
authors = ["WtekSupport"]
edition = "2021"
rust-version = "1.70"
description = "TGScanner — desktop GUI to look up public Telegram profile info via the user API (grammers)"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["telegram", "grammers", "fltk", "desktop", "tgscanner"]
categories = ["gui"]
repository = "https://github.com/WtekSupport/TGScanner"
homepage = "https://github.com/WtekSupport/TGScanner"
documentation = "https://github.com/WtekSupport/TGScanner#readme"
exclude = ["/output", ".tguser_*"]

[dependencies]
anyhow = "1"
fltk = { version = "1.5", features = ["fltk-bundled"] }
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
chacha20poly1305 = "0.10"
rand = "0.8"
keyring = "3"
sha2 = "0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
