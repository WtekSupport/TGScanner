name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach assets to (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libclang-dev libx11-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libwayland-dev libsecret-1-dev

      - run: cargo build --release --locked

      - name: Stage Linux binary
        run: |
          mkdir -p dist
          cp target/release/tgscanner dist/tgscanner-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgscanner-linux-x86_64
          path: dist/tgscanner-linux-x86_64
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Stage Windows binary
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tgscanner.exe dist/tgscanner-windows-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgscanner-windows-x86_64
          path: dist/tgscanner-windows-x86_64.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Stage macOS binary
        run: |
          mkdir -p dist
          cp target/release/tgscanner dist/tgscanner-macos-universal

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgscanner-macos-universal
          path: dist/tgscanner-macos-universal
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    if: >-
      always() &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
